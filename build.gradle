plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content { includeGroup("software.bernie.geckolib") }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content { includeGroup("mezz.jei") }
    }
    flatDir {
        dir('libs')
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge-${neo_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // astral_core + almanac_core (MIT, real) — sibling SKD repos, local jars, never bundled.
    // See docs/DESIGN_MAJESTIC_1-21-1.md. `majestic` is All Rights Reserved; every dependency is
    // resolved by the user / by CurseForge as a required or optional dependency, never jar-in-jar.
    compileOnly files("libs/astral_core-${minecraft_version}-neoforge-${neo_version}-${astral_core_version}.jar")
    localRuntime files("libs/astral_core-${minecraft_version}-neoforge-${neo_version}-${astral_core_version}.jar")
    compileOnly files("libs/almanac_core-${minecraft_version}-neoforge-${neo_version}-${almanac_core_version}.jar")
    localRuntime files("libs/almanac_core-${minecraft_version}-neoforge-${neo_version}-${almanac_core_version}.jar")

    // regalia_slots_api (LGPL-3.0) — not used by majestic's own code directly, but astral_core's
    // neoforge.mods.toml requires it, so our own dev runs need it present transitively (`files(...)`
    // deps don't resolve astral_core's own transitive requirements). Real players never need this
    // line — installing astral_core already pulls in regalia_slots_api on its own merit.
    localRuntime files("libs/regalia_slots_api-${minecraft_version}-neoforge-${neo_version}-1.0.0.jar")

    // expedition_core (MIT, real) — sibling SKD repo, local jar, never bundled.
    compileOnly files("libs/expedition_core-${minecraft_version}-neoforge-${neo_version}-${expedition_core_version}.jar")
    localRuntime files("libs/expedition_core-${minecraft_version}-neoforge-${neo_version}-${expedition_core_version}.jar")

    // GeckoLib — real dependency (Act I-II bosses use expedition_core's GeoBossEntity/GeoBossRenderer base).
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Wired in later milestones:
    //   - jei / vellumli : soft, transitive via almanac_core
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/resources/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
