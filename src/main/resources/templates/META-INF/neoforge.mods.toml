modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://gitlab.com/stalking-dragons/minecraft/majestic"
logoFile="icon.png"
credits="Developed by Stalking Dragons"
description='''Majestic is a magic and adventure mod: arcane-celestial magic — stars, constellations, light and ether. Power is earned by exploring and refined by ritual, across three linked layers (rituals & research, spells, relics), gated behind a new dimension (the Celestial Plane), structures and bosses. Built on the Astral Core, Expedition Core and Almanac Core libraries.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="AFTER"
    side="BOTH"

# Wired in a later milestone (all required except jei/vellumli):
#   astral_core, expedition_core, almanac_core, geckolib  -> type="required"
#   jei, vellumli                                         -> type="optional"
